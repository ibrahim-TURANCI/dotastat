# Her push ve pull request'te web derlemesini ve testleri dogrular.
#
# Netlify'a yayin bu is akisiyla YAPILMAZ; Netlify repoyu kendisi izler ve
# main dalina her push'ta siteyi yeniden yayinlar. Buradaki is, bozuk bir
# derlemenin fark edilmeden yayina gitmesini engellemek icindir.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Core testleri
        run: npm test

      - name: Web derlemesi
        run: npm run build:web

      - name: Bicim kontrolu
        run: npm run lint:format
        continue-on-error: true

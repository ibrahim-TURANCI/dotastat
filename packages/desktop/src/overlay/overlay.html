<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' https://cdn.cloudflare.steamstatic.com; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'"
    />
    <title>DotaStat overlay</title>
    <style>
      /*
       * Discord'un oyun ustu bildirimleri gibi: soluk, kucuk, dikkat cekmeyen.
       * Pencere fareyi altina gecirdigi icin hover durumu yok; her sey ilk
       * bakista okunmali.
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }

      body {
        display: flex;
        justify-content: flex-end;
        align-items: flex-end;
      }

      .card {
        opacity: 0;
        transition: opacity 0.4s ease;
        padding: 6px 8px 7px;
        border-radius: 10px;
        background: rgba(8, 14, 22, 0.55);
        color: rgba(230, 238, 247, 0.85);
      }

      .card.ready {
        opacity: 0.72;
      }

      .head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 5px;
        font-size: 11px;
        line-height: 1;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      }

      .head img {
        width: 18px;
        height: 18px;
      }

      .head strong {
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .head span {
        color: rgba(230, 238, 247, 0.55);
      }

      .items {
        display: flex;
        gap: 5px;
      }

      .item {
        width: 58px;
        text-align: center;
      }

      .icon {
        position: relative;
        width: 58px;
        height: 42px;
        border-radius: 5px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
        box-shadow: inset 0 -2px 0 var(--group);
      }

      .icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .icon b {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 12px;
      }

      .name {
        margin-top: 2px;
        font-size: 9.5px;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: rgba(230, 238, 247, 0.7);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
      }

      .core {
        --group: #4aa3ff;
      }
      .counter {
        --group: #ff6b6b;
      }
      .situational {
        --group: #f2b84b;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="head">
        <img src="logo.png" alt="" />
        <strong>DotaStat</strong>
        <span id="hero"></span>
      </div>
      <div class="items" id="items"></div>
    </div>

    <script>
      const card = document.getElementById("card");
      const hero = document.getElementById("hero");
      const list = document.getElementById("items");

      /** @param {{ hero?: string, items?: Array<Record<string, string>> }} state */
      function render(state) {
        hero.textContent = state.hero ? "· " + state.hero : "";
        list.replaceChildren(
          ...(state.items || []).map((row) => {
            const item = document.createElement("div");
            item.className = "item " + (row.group || "core");

            const icon = document.createElement("div");
            icon.className = "icon";
            const img = document.createElement("img");
            img.src = row.icon;
            img.alt = "";
            img.onerror = () => {
              const fallback = document.createElement("b");
              fallback.textContent = String(row.name || row.key)
                .slice(0, 2)
                .toUpperCase();
              img.replaceWith(fallback);
            };
            icon.append(img);

            const name = document.createElement("div");
            name.className = "name";
            name.textContent =
              (row.group === "counter" ? "⚔ " : "") + (row.name || row.key);

            item.append(icon, name);
            return item;
          }),
        );
        card.classList.add("ready");
      }

      window.overlay?.onUpdate(render);
    </script>
  </body>
</html>
